<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make A Wish 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <nav class="top-nav">
            <span>06 / 07</span>
            <a href="letter.html">←</a>
        </nav>

        <main class="cake-page">
            <p class="eyebrow">MAKE A WISH</p>
            <h1>Close your eyes.<br><span>Make a wish. 🎂</span></h1>
            <p>Click the flame to blow out the candle.</p>

            <div class="cake">
                <div class="plate"></div>

                <div class="cake-body">
                    <div class="icing"></div>
                    <div class="cake-decoration">• • • • •</div>
                </div>

                <div class="candle">
                    <div id="flame" class="flame"></div>
                </div>
            </div>

            <div id="wishMessage" class="wish-message">
                <strong>✨ Wish made ✨</strong><br><br>
                May every dream you have find its way to you. ❤️
            </div>

            <a id="continueBtn" href="surprise.html" class="main-btn hidden">
                Open your final surprise 🎁
            </a>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
